<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин одежды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <h1>🛍️ Fashion Store</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Поиск товаров...">
            </div>
        </header>

        <!-- Категории -->
        <nav class="categories">
            <button class="category-btn active" data-category="all">Все</button>
            <button class="category-btn" data-category="tops">Верхняя одежда</button>
            <button class="category-btn" data-category="bottoms">Низ</button>
            <button class="category-btn" data-category="shoes">Обувь</button>
            <button class="category-btn" data-category="accessories">Аксессуары</button>
        </nav>

        <!-- Сетка товаров -->
        <main class="products-grid" id="productsGrid"></main>

        <!-- Корзина (плавающая кнопка) -->
        <div class="cart-float" id="cartFloat" onclick="showCart()">
            🛒 <span id="cartCount">0</span>
        </div>
    </div>

    <!-- Модальное окно товара -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <img src="" alt="" id="modalImage" class="modal-image">
            <h2 id="modalTitle"></h2>
            <p class="modal-price" id="modalPrice"></p>
            <p class="modal-description" id="modalDescription"></p>
            <div class="size-selector">
                <span>Размер:</span>
                <div class="sizes" id="sizeSelector"></div>
            </div>
            <button class="add-to-cart-btn" onclick="addToCart()">В корзину</button>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cartModal">
        <div class="modal-content cart-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>🛒 Корзина</h2>
            <div id="cartItems"></div>
            <div class="cart-total">
                <strong>Итого: <span id="cartTotal">0</span> ₽</strong>
            </div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
